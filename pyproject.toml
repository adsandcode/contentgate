[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contentgate"
version = "0.1.0"
description = "Pre-deploy guards for content sites: keyword coverage, translation drift, internal links, regulated claims, honest sitemap lastmod."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ads & Code" }]
keywords = ["seo", "technical-seo", "sitemap", "lastmod", "i18n", "translation", "content", "ci", "static-site"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://adsandcode.com/en/open-source/contentgate/"
Source = "https://github.com/hahaha821102-droid/contentgate"
Issues = "https://github.com/hahaha821102-droid/contentgate/issues"

[project.scripts]
contentgate = "contentgate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contentgate = ["../../fixtures/cases.json"]
